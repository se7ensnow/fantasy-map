name: Unit tests

on:
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_dir: api_gateway
            tests_dir: api_gateway_tests
            job_name: API Gateway
          - service_dir: map_service
            tests_dir: map_service_tests
            job_name: Map Service
          - service_dir: tile_service
            tests_dir: tile_service_tests
            job_name: Tile Service
          - service_dir: user_service
            tests_dir: user_service_tests
            job_name: User Service

    name: ${{ matrix.job_name }} tests

    defaults:
      run:
        working-directory: ./${{ matrix.service_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-httpx pytest-mock

      - name: Run tests
        run: pytest ${{ matrix.tests_dir }} -v
