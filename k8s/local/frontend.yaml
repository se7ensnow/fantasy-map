apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fantasy-maps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: fantasy-maps-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fantasy-maps
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80