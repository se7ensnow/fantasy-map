apiVersion: batch/v1
kind: Job
metadata:
  name: map-service-migrations
  namespace: fantasy-maps
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: fantasy-maps-map-service:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: map-service-secret