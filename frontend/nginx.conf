server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка карт может быть большой.
    client_max_body_size 512m;

    # Браузер ходит только на тот адрес, по которому открыт сайт (localhost,
    # IP в локальной сети и т.д.), а NGINX сам проксирует запросы внутрь
    # docker-сети. Поэтому frontend работает с любого устройства без CORS.
    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE (/api/jobs/<id>/events): не буферизуем поток.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # Тайлы и файлы карт из MinIO: /storage/<bucket>/<key> -> minio:9000/<bucket>/<key>.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=3600";
    }

    # Hashed build assets can be cached forever; a stale index.html must always
    # be revalidated, otherwise Safari can pair it with missing JS/CSS chunks
    # after a redeploy and render a blank page.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
