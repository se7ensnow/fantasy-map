services:

  user-db:
    image: postgres:15
    container_name: user-db
    restart: always
    env_file:
      - ./.envs/user-db.env
    ports:
      - "5433:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  map-db:
    image: postgres:15
    container_name: map-db
    restart: always
    env_file:
      - ./.envs/map-db.env
    ports:
      - "5434:5432"
    volumes:
      - pg-map-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    env_file:
      - ./.envs/minio.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/fantasy-maps &&
      mc anonymous set download local/fantasy-maps &&
      mc anonymous get local/fantasy-maps
      "
    env_file:
      - ./.envs/minio.env
    restart: "no"

  user-service:
    build:
      context: ./user_service
    container_name: user-service
    depends_on:
      user-db:
        condition: service_healthy
    env_file:
      - ./.envs/user-service.env
    ports:
      - "8001:8000"

  map-service:
    build:
      context: ./map_service
    container_name: map-service
    depends_on:
      map-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./.envs/map-service.env
    ports:
      - "8002:8000"

  tile-service:
    build: ./tile_service
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    restart: always
    env_file:
      - ./.envs/tile-service.env

  api-gateway:
    build:
      context: ./api_gateway
    container_name: api-gateway
    depends_on:
      - user-service
      - map-service
    env_file:
      - ./.envs/api-gateway.env
    ports:
      - "8000:8000"

volumes:
  pg-user-data:
  pg-map-data:
  minio-data: