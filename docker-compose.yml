name: fantasy-maps

# Общие настройки для сервисов приложений (не инфраструктуры).
x-app: &app
  restart: unless-stopped
  init: true
  networks:
    - backend

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  user-db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ./.envs/user-db.env
    ports:
      - "${USER_DB_PORT:-5433}:5432"
    volumes:
      - pg-user-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    networks:
      - backend

  map-db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ./.envs/map-db.env
    ports:
      - "${MAP_DB_PORT:-5434}:5432"
    volumes:
      - pg-map-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio:
    # Официальные образы quay.io/minio/* сейчас требуют авторизации (401).
    # Для локального запуска используется публичное зеркало того же MinIO.
    # Можно переопределить в .env: MINIO_IMAGE, MINIO_MC_IMAGE.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    env_file:
      - ./.envs/minio.env
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  minio-init:
    image: ${MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-11-12T00-00-00Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET:-fantasy-maps}" &&
        mc anonymous set download "local/$${MINIO_BUCKET:-fantasy-maps}"
    env_file:
      - ./.envs/minio.env
    restart: "no"
    networks:
      - backend

  user-service-migrations:
    build:
      context: ./user_service
    image: fantasy-maps-user-service:local
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./.envs/user-service.env
    depends_on:
      user-db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  map-service-migrations:
    build:
      context: ./map_service
    image: fantasy-maps-map-service:local
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./.envs/map-service.env
    depends_on:
      map-db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  user-service:
    <<: *app
    build:
      context: ./user_service
    image: fantasy-maps-user-service:local
    env_file:
      - ./.envs/user-service.env
    ports:
      - "${USER_SERVICE_PORT:-8001}:8000"
    depends_on:
      user-db:
        condition: service_healthy
      user-service-migrations:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"

  map-service:
    <<: *app
    build:
      context: ./map_service
    image: fantasy-maps-map-service:local
    env_file:
      - ./.envs/map-service.env
    ports:
      - "${MAP_SERVICE_PORT:-8002}:8000"
    depends_on:
      map-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      map-service-migrations:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"

  tile-service:
    <<: *app
    build:
      context: ./tile_service
    image: fantasy-maps-tile-service:local
    # pillow-simd собирается под linux/amd64; на Apple Silicon используется эмуляция.
    platform: ${TILE_SERVICE_PLATFORM:-linux/amd64}
    env_file:
      - ./.envs/tile-service.env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      map-service:
        condition: service_healthy

  api-gateway:
    <<: *app
    build:
      context: ./api_gateway
    image: fantasy-maps-api-gateway:local
    env_file:
      - ./.envs/api-gateway.env
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      user-service:
        condition: service_healthy
      map-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"

  frontend:
    <<: *app
    # Frontend в Docker — опционально: для разработки удобнее `npm run dev` (Vite + hot reload).
    # Запуск: `make up-full` или `docker compose --profile frontend up --build -d`.
    profiles:
      - frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_STORAGE_URL: ${VITE_STORAGE_URL:-/storage/fantasy-maps}
    image: fantasy-maps-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api-gateway:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  backend:
    driver: bridge

volumes:
  pg-user-data:
  pg-map-data:
  redis-data:
  minio-data:
